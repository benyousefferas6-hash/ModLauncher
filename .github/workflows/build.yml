name: Build downloads

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        run: |
          pyinstaller --noconsole --onefile --name ModLauncher-Windows main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModLauncher-Windows
          path: dist/ModLauncher-Windows.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Qt/PyQt prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Linux)
        run: |
          pyinstaller --onefile --name ModLauncher-Linux main.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModLauncher-Linux
          path: dist/ModLauncher-Linux
